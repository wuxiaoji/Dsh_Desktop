<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>DeepSeek Harness</title>
  </head>
  <body>
    <div class="bg-aurora" aria-hidden="true"></div>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <img class="whale whale--sm" src="/logo.svg" alt="" aria-hidden="true">
          <div class="brand-text">
            <div class="brand-name">DeepSeek Harness</div>
            <div class="brand-sub">DESKTOP HOST</div>
          </div>
        </div>
        <span class="phase-pill" id="phase-label">INITIALIZING</span>
      </header>

      <section class="hero" aria-live="polite">
        <img class="whale whale--hero" src="/logo.svg" alt="" aria-hidden="true">
        <h1 id="status-title">正在准备启动环境</h1>
        <p id="status-detail" class="hero-sub">启动器正在连接本机运行时。</p>
        <div class="progress-track"><span id="progress-bar"></span></div>
        <button id="retry-button" class="btn btn--ghost" type="button" hidden>重新检测</button>
      </section>

      <section class="checks" aria-label="环境检查">
        <div class="checks-head"><span>运行环境检查</span><span>状态</span></div>
        <div class="check-row" id="check-webview">
          <span class="check-icon" aria-hidden="true"></span>
          <span class="check-name">WebView2 Runtime</span>
          <span class="check-value">检测中</span>
        </div>
        <div class="check-row" id="check-node">
          <span class="check-icon" aria-hidden="true"></span>
          <span class="check-name">Node.js</span>
          <span class="check-value">等待</span>
        </div>
        <div class="check-row" id="check-dsh">
          <span class="check-icon" aria-hidden="true"></span>
          <span class="check-name">DeepSeek Harness</span>
          <span class="check-value">等待</span>
        </div>
        <div class="check-row" id="check-server">
          <span class="check-icon" aria-hidden="true"></span>
          <span class="check-name">本地 Web 服务</span>
          <span class="check-value">等待</span>
        </div>
      </section>

      <div class="update-bar" id="update-bar" hidden>
        <div class="update-copy">
          <div class="update-title">发现 DeepSeek Harness 新版本</div>
          <div class="update-meta" id="update-meta"></div>
        </div>
        <div class="update-actions">
          <button id="skip-button" class="btn btn--ghost btn--sm" type="button">暂不更新</button>
          <button id="update-button" class="btn btn--brand" type="button">立即更新</button>
        </div>
      </div>

      <footer>
        <span id="footer-note">127.0.0.1 · 动态端口 · 免配置托管</span>
        <span class="footer-mark">DeepSeek Harness Desktop</span>
      </footer>
    </main>

    <div class="modal-backdrop" id="update-confirm" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
        <h2 id="confirm-title">更新 DeepSeek Harness</h2>
        <p id="confirm-detail" class="modal-copy"></p>
        <div class="modal-actions">
          <button id="confirm-cancel" class="btn btn--ghost" type="button">取消</button>
          <button id="confirm-ok" class="btn btn--brand" type="button">确认更新</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
