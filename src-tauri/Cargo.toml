[package]
name = "dsh-desktop-host"
version = "0.1.8"
description = "A lightweight Windows desktop host for DeepSeek Harness"
authors = ["DSH Desktop Host contributors"]
edition = "2021"

[lib]
name = "dsh_desktop_host_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
semver = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
